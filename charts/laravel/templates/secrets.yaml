{{- if hasKey .Values "encryptionKey" }}
{{- fail "encryptionKey is no longer a chart value; decrypt secrets locally with k8s-tools 2.x" }}
{{- end }}
{{- range $setKey, $setValues := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.resourcePrefix }}{{ $setKey }}
{{- if $setValues.type }}
type: {{ $setValues.type  }}
{{- end }}
data:
  {{- range $key, $value := $setValues.data }}
  {{- if not (kindIs "string" $value) }}
  {{- printf "secret %s.%s must be a string" $setKey $key | fail }}
  {{- end }}
  {{- if hasPrefix "HELM_SECRET:" $value }}
  {{- printf "secret %s.%s is still encrypted; use k8s-tools 2.x local decryption" $setKey $key | fail }}
  {{- end }}
  {{ $key | quote }}: {{ $value | b64enc | quote }}
  {{- end }}
---
{{- end }}
